[project]
name = "laba-3-task-queue"
version = "0.1.0"
description = "Лабораторная работа №3: очередь задач, итераторы и генераторы"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=5.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
omit = [
    "src/main.py",
    "src/__init__.py",
]
